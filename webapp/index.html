<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnnaBot</title>
<!-- The official Telegram WebApp SDK. It is the platform bridge (tg.*) and
     is intentionally NOT SRI-pinned: Telegram serves it unversioned and updates
     it in place, so a pinned hash would break the Mini App on their next
     release. Inside the Telegram client the client-side copy takes precedence
     anyway; this tag is the fallback for external browsers. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #1a1023;
    --bg2: #221430;
    --card: #2b1a3d;
    --card2: #33204a;
    --accent: #e8447f;
    --accent2: #b844e8;
    --text: #f5eef8;
    --muted: #a894bd;
    --ok: #4cd97b;
    --premium: #ffcf5c;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 76px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    background: rgba(26, 16, 35, .92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(232, 68, 127, .18);
  }
  header .logo {
    font-size: 20px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header .chip {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
    background: var(--card); border-radius: 20px; padding: 6px 12px;
  }
  header .chip.premium { color: var(--premium); }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  section.tab { display: none; animation: fade .18s ease; }
  section.tab.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  h2 { font-size: 17px; margin: 4px 0 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: var(--card); border-radius: var(--radius);
    overflow: hidden; border: 1px solid rgba(255,255,255,.05);
    transition: transform .12s ease;
  }
  .card.selected { border: 2px solid var(--accent); }
  .card .photo { position: relative; aspect-ratio: 3/4; background: var(--card2); }
  .card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* V3.43.1: the living tile — muted looping mp4 in the same 3:4 frame */
  .card .photo video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .photo .fallback {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; font-size: 64px;
  }
  .card .badge {
    position: absolute; top: 8px; left: 8px;
    font-size: 11px; padding: 3px 9px; border-radius: 12px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
  }
  .card .badge.active { color: var(--ok); }
  .card .badge.premium { color: var(--premium); }
  .card .badge.soon { color: var(--muted); }
    /* V3.40.0: the view-count pill on the card corner — the Come Closer
       «👁 427k» badge, riding on top of the living GIF tile. */
    .card .views {
      position: absolute; top: 8px; right: 8px;
      font-size: 11px; padding: 3px 9px; border-radius: 12px;
      background: rgba(0,0,0,.55); backdrop-filter: blur(4px); color: #fff;
    }
  .card .body { padding: 10px 12px 12px; }
  .card .name { font-weight: 600; font-size: 15px; }
  .card .age { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  .card .bio { color: var(--muted); font-size: 12px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .hero {
    background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
    border: 1px solid rgba(255, 207, 92, .25);
  }
  .hero .title { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; color: var(--premium); }
  .hero .price { font-size: 26px; font-weight: 800; margin: 10px 0 2px; }
  .hero .price small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .hero ul { list-style: none; margin-top: 12px; }
  .hero li { display: flex; gap: 8px; font-size: 13px; padding: 4px 0; color: var(--text); }
  .note {
    font-size: 12px; color: var(--muted); text-align: center; padding: 10px;
    background: var(--card); border-radius: 12px; margin-top: 12px;
  }
  .row-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
  }
  .row-item .n { font-size: 14px; }
  .row-item .c { color: var(--premium); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .card { cursor: pointer; }
  .card:active { transform: scale(.97); }
  .cta {
    display: block; width: 100%; border: none; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff; font-size: 15px; font-weight: 700;
    padding: 12px; border-radius: 12px; margin-top: 12px;
  }
  .cta:active { transform: scale(.98); }
  .cta:disabled { opacity: .55; }
  .cta.small { width: auto; margin: 0; padding: 8px 14px; font-size: 13px; }
  .cta.ghost { background: transparent; border: 1px solid rgba(232, 68, 127, .5); margin-top: 8px; }
  .row-item .buy-cell { display: flex; align-items: center; gap: 10px; }
  #toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-90px);
    background: rgba(20, 12, 28, .96); color: var(--text);
    border: 1px solid rgba(232, 68, 127, .35); border-radius: 14px;
    padding: 10px 16px; font-size: 13px; z-index: 50; max-width: 86vw; text-align: center;
    transition: transform .22s ease; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  .profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; flex-shrink: 0;
  }
  .profile-head .nm { font-size: 18px; font-weight: 700; }
  .profile-head .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .stat {
    background: var(--card); border-radius: 12px; padding: 14px;
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .stat .k { color: var(--muted); font-size: 13px; }
  .stat .v { font-weight: 700; font-size: 15px; }
  .bar { height: 8px; background: var(--card2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  details.doc {
    background: var(--card); border-radius: 12px; margin-bottom: 10px; overflow: hidden;
  }
  details.doc summary {
    padding: 14px; font-weight: 600; font-size: 14px; cursor: pointer; list-style: none;
    display: flex; align-items: center; gap: 8px;
  }
  details.doc summary::-webkit-details-marker { display: none; }
  details.doc summary::after { content: '›'; margin-left: auto; transform: rotate(90deg); transition: transform .15s; }
  details.doc[open] summary::after { transform: rotate(-90deg); }
  details.doc .txt {
    padding: 0 14px 14px; font-size: 12.5px; line-height: 1.55; color: var(--text);
    white-space: pre-wrap; word-break: break-word; max-height: 60vh; overflow-y: auto;
  }
  .checkword {
    text-align: center; color: var(--muted); font-size: 12px; padding: 8px 0 14px;
  }
  .loading { text-align: center; color: var(--muted); padding: 48px 0; font-size: 14px; }
  .err { text-align: center; color: var(--accent); padding: 48px 16px; font-size: 14px; line-height: 1.5; }
  nav#bottomnav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: flex; background: rgba(20, 12, 28, .96);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(232, 68, 127, .18);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  nav#bottomnav button {
    flex: 1; background: none; border: none; color: var(--muted);
    font-size: 11px; padding: 8px 4px; border-radius: 12px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav#bottomnav button .ico { font-size: 21px; }
  nav#bottomnav button.on { color: var(--accent); background: rgba(232, 68, 127, .12); }
  /* V3.35.0: full-screen overlays — in-app chat and the character wizard */
  .overlay {
    position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; background: var(--bg);
  }
  .overlay.open { display: flex; }
  .chat-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: rgba(26, 16, 35, .96); border-bottom: 1px solid rgba(232, 68, 127, .18);
    flex-shrink: 0;
  }
  .chat-head .p {
    width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
    background: var(--card2); flex-shrink: 0;
  }
  .chat-head .p.pdiv { display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .chat-head .nm { font-weight: 700; font-size: 15px; }
  .chat-head .sub { color: var(--muted); font-size: 11px; }
  .chat-head .spacer { margin-left: auto; }
  .chat-head .iconbtn {
    background: var(--card); border: none; color: var(--text); font-size: 18px;
    border-radius: 12px; padding: 8px 12px; cursor: pointer;
  }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg {
    max-width: 82%; padding: 9px 12px; border-radius: 16px; font-size: 14px;
    line-height: 1.45; word-break: break-word; white-space: pre-wrap;
  }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card); border-bottom-left-radius: 4px; }
  .msg .t { display: block; font-size: 10px; opacity: .6; margin-top: 4px; }
  .chat-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 20px; line-height: 1.5; }
  .chat-input {
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(20, 12, 28, .96); border-top: 1px solid rgba(232, 68, 127, .18); flex-shrink: 0;
  }
  .chat-input input {
    flex: 1; background: var(--card); border: 1px solid rgba(255,255,255,.08);
    color: var(--text); font-size: 15px; padding: 11px 14px; border-radius: 14px; outline: none;
  }
  .chat-input button {
    background: linear-gradient(90deg, var(--accent), var(--accent2)); border: none; color: #fff;
    font-size: 16px; padding: 0 18px; border-radius: 14px; cursor: pointer;
  }
  .chat-input button:disabled { opacity: .5; }
  /* V3.39.0: Come Closer character page — photo strip, CTA, plot block */
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 12px 14px 4px; }
  .strip img { width: 74px; height: 96px; object-fit: cover; border-radius: 12px; border: 2px solid transparent; cursor: pointer; flex: 0 0 auto; background: var(--card2); }
  .strip img.on { border-color: var(--accent); }
  /* V3.43.0: channel-subscribe bonus banner on the characters tab */
  .chanbanner {
    display: flex; align-items: center; gap: 12px; width: calc(100% - 8px);
    margin: 12px 4px 4px; padding: 15px 16px; border: 0; border-radius: 16px;
    background: linear-gradient(90deg, rgba(232,68,127,.28), rgba(184,68,232,.16));
    color: var(--text); cursor: pointer;
  }
  .chanbanner .gift {
    width: 46px; height: 46px; border-radius: 50%; flex: 0 0 auto;
    background: radial-gradient(circle at 35% 30%, #ff9ec7, var(--accent));
    display: flex; align-items: center; justify-content: center; font-size: 23px;
  }
  .chanbanner .t { flex: 1; text-align: left; font-size: 15px; font-weight: 700; line-height: 1.3; }
  .chanbanner .ar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--accent);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  /* V3.43.0: the centered gift modal for the channel bonus */
  #chanmodal {
    position: fixed; inset: 0; z-index: 45; display: none;
    align-items: center; justify-content: center; background: rgba(10,5,14,.62);
  }
  #chanmodal.open { display: flex; }
  #chanmodal .box {
    width: min(320px, 86vw); background: var(--card); border-radius: 18px;
    padding: 20px 16px 16px; text-align: center; position: relative;
  }
  #chanmodal .gift {
    width: 62px; height: 62px; border-radius: 50%; margin: 0 auto 10px;
    background: radial-gradient(circle at 35% 30%, #ff9ec7, var(--accent));
    display: flex; align-items: center; justify-content: center; font-size: 29px;
  }
  #chanmodal h3 { margin: 0 0 6px; font-size: 16px; color: var(--text); }
  #chanmodal .txt { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  #chanmodal .warn {
    background: rgba(255,193,7,.13); color: #ffc107; border-radius: 10px;
    font-size: 12px; padding: 8px 10px; margin-bottom: 12px;
  }
  #chanmodal .go, #chanmodal .chk {
    width: 100%; border: 0; border-radius: 12px; padding: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #chanmodal .go { background: linear-gradient(90deg, var(--accent), #ff7ab0); color: #fff; margin-bottom: 8px; }
  #chanmodal .chk { background: var(--card2); color: var(--text); }
  #chanmodal .x {
    position: absolute; top: 8px; right: 10px; border: 0; background: transparent;
    color: var(--muted); font-size: 14px; cursor: pointer; padding: 4px;
  }
  /* V3.43.0: Come Closer pack squares + the pay-method modal */
  .packs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .pack {
    position: relative;
    background: var(--card); border: 1px solid rgba(232, 68, 127, .16);
    border-radius: 14px; padding: 12px 8px 10px; text-align: center; cursor: pointer;
  }
  /* V3.43.1: the discount badge on the 30/100 peach packs */
  .pack .bdg {
    position: absolute; top: 6px; right: 6px; padding: 2px 7px; border-radius: 8px;
    background: linear-gradient(90deg, var(--accent), #ff7ab0); color: #fff;
    font-size: 10px; font-weight: 700;
  }
  .pack .amt { font-size: 16px; font-weight: 700; color: var(--text); }
  .pack .sub { color: var(--text); font-size: 11px; margin-top: 3px; }
  .pack .rub { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
  .pack .get {
    width: 100%; border: 0; border-radius: 10px; padding: 7px 0;
    background: rgba(232, 68, 127, .16); color: var(--accent);
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  #paymodal {
    position: fixed; inset: 0; z-index: 46; display: none;
    align-items: center; justify-content: center; background: rgba(10,5,14,.62);
  }
  #paymodal.open { display: flex; }
  #paymodal .box {
    width: min(320px, 86vw); background: var(--card); border-radius: 18px;
    padding: 20px 16px 16px; text-align: center; position: relative;
  }
  #paymodal .emo { font-size: 40px; margin-bottom: 6px; }
  #paymodal h3 { margin: 0 0 12px; font-size: 16px; color: var(--text); }
  #paymodal .mrow {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: var(--card2); border: 0; border-radius: 12px;
    padding: 12px; margin-bottom: 8px; cursor: pointer;
    color: var(--text); font-size: 14px; text-align: left;
  }
  #paymodal .mrow:disabled { opacity: .55; }
  #paymodal .mrow .ico { font-size: 18px; }
  #paymodal .mrow .nm { flex: 1; font-weight: 600; }
  #paymodal .mrow .pr {
    background: rgba(232, 68, 127, .16); color: var(--accent);
    border-radius: 9px; padding: 5px 9px; font-size: 12px; font-weight: 700;
  }
  #paymodal .x {
    position: absolute; top: 8px; right: 10px; border: 0; background: transparent;
    color: var(--muted); font-size: 14px; cursor: pointer; padding: 4px;
  }
  /* V3.43.0: full-screen lightbox — a tap on any photo opens it */
  #lightbox {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,.92);
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 96vw; max-height: 92vh; border-radius: 10px; }
  #lightbox .x {
    position: absolute; top: 12px; right: 12px; border: 0; border-radius: 50%;
    width: 34px; height: 34px; background: rgba(255,255,255,.14); color: #fff;
    font-size: 16px; cursor: pointer;
  }
  /* V3.43.0: character-page carousel arrows/dots + the like badge */
  .stripwrap { position: relative; }
  .stripwrap .nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 30px; height: 30px; border: 0; border-radius: 50%;
    background: rgba(10,5,14,.55); color: #fff; font-size: 17px; cursor: pointer;
  }
  .stripwrap .nav.prev { left: 6px; }
  .stripwrap .nav.next { right: 6px; }
  .stripdots { display: flex; gap: 5px; justify-content: center; margin: 6px 0 2px; }
  .stripdots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: .5; }
  .stripdots i.on { background: var(--accent); opacity: 1; }
  .charlike {
    position: absolute; top: 14px; right: 12px; z-index: 2; border: 0; border-radius: 14px;
    background: rgba(10,5,14,.55); color: #fff; font-size: 16px; font-weight: 700; padding: 10px 16px; cursor: pointer;
  }
  .charlike.on { color: #ff7ab0; }
  .charhero { padding: 6px 16px 0; }
  .charhero h1 { margin: 6px 0 2px; font-size: 26px; }
  .charcta { display: block; width: calc(100% - 32px); margin: 14px 16px; padding: 14px; border: 0; border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  .charblock { margin: 10px 16px; padding: 12px 14px; background: var(--card); border-radius: 14px; line-height: 1.45; white-space: pre-wrap; }
  .charblock .lbl3 { color: var(--accent); font-size: 12px; letter-spacing: .08em; margin-bottom: 6px; }
  /* V3.39.0: media inside the in-app chat (photos / circles / voice) */
  .msg img.m { display: block; max-width: 220px; width: 100%; border-radius: 12px; margin-top: 4px; background: var(--card2); }
  .msg video.circle { display: block; width: 180px; height: 180px; object-fit: cover; border-radius: 50%; margin-top: 4px; background: #000; }
  .msg audio { display: block; width: 220px; margin-top: 4px; }
  .chat-media { display: flex; gap: 6px; width: 100%; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
  /* V3.42.2: readable labeled pills instead of cryptic 38px icon squares — a
     newcomer must read what each action does, not guess from an emoji. */
  .chat-media button { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; border-radius: 12px; background: var(--card); padding: 6px 10px; cursor: pointer; }
  .chat-media button .ic { font-size: 17px; line-height: 1; }
  .chat-media button .lb { font-size: 10px; color: var(--text); white-space: nowrap; }
  .chat-media button:disabled { opacity: .5; }
  /* V3.41.0: 7 feature buttons — the strip scrolls on its own row above the input. */
  .chat-input { flex-wrap: wrap; }
  .msg video.m { display: block; max-width: 220px; width: 100%; border-radius: 12px; margin-top: 4px; background: #000; }
  /* V3.41.0: the feature sheet (apartment rooms / dates / daily quest). */
  .featlist { padding: 12px 14px calc(20px + env(safe-area-inset-bottom)); }
  .featitem { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 1px solid rgba(255,255,255,.08); color: var(--text); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
  .featitem.locked { opacity: .55; cursor: default; }
  .featitem .fem { font-size: 22px; flex: 0 0 auto; }
  .featitem .fet { flex: 1; min-width: 0; }
  .featitem .fen { font-weight: 700; font-size: 15px; }
  .featitem .fes { color: var(--muted); font-size: 12.5px; margin-top: 2px; line-height: 1.35; }
  .featitem .fec { font-size: 13px; font-weight: 700; color: var(--accent); flex: 0 0 auto; }
  .featactions { display: none; flex-wrap: wrap; gap: 6px; margin: -2px 0 10px; }
  .featactions.open { display: flex; }
  .featactions button { background: var(--card2); border: 1px solid rgba(255,255,255,.1); color: var(--text); font-size: 13px; padding: 8px 12px; border-radius: 12px; cursor: pointer; }
  /* V3.43.7: section headers inside the photo scene menu. */
  .featgroup { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin: 14px 2px 8px; }
  .featlist .featgroup:first-child { margin-top: 2px; }
  .featquest { padding: 16px; }
  .featquest .qtext { background: var(--card); border-radius: 14px; padding: 14px; line-height: 1.5; margin-bottom: 12px; }
  .featdone { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let ME = null;

function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
function showTab(name) {

async function buy(productId, btn) {
  if (btn) btn.disabled = true;
  const done = () => { if (btn) btn.disabled = false; };
  try {
    const r = await fetch('/webapp/api/invoice?init_data=' + encodeURIComponent(tg.initData || ''), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product: productId }),
    });
    if (r.status === 401) { toast(L.auth_short); done(); return; }
    const j = await r.json();
    if (!j.ok) { toast(L.invoice_err); done(); return; }
    if (typeof tg.openInvoice !== 'function') { toast(L.auth_short); done(); return; }
    tg.openInvoice(j.link, (status) => {
      done();
      if (status === 'paid') {
        toast(productId === 'premium' ? L.paid_prem : L.paid_credit);
        loadMe(); loadShop(); loadCharacters();
      } else if (status === 'failed') {
        toast(L.pay_failed);
      } else {
        toast(L.pay_cancelled);
      }
    });
  } catch (e) {
    toast(L.invoice_err); done();
  }
}

let CHARS = [];
let CHAR_SEG = 'official';
function renderCharacters(list) {
  CHARS = list;
  // V3.39.0: the segment switch — the official roster lives in the «Peach
  // Garden», constructor personas made by people live in the «Community».
  const shown = list.filter(c => (CHAR_SEG === 'official' ? !c.custom : !!c.custom));
  const grid = document.getElementById('chargrid');
  // V3.35.0: the grid is the chat entry now — tap opens the dialog; the
  // «create your own» card rides at the end of the grid.
  const hasMine = shown.some(c => c.mine);
  const cards = shown.map(c => {
    const badge = c.status === 'active'
      ? `<span class="badge active">✅ ${esc(L.active)}</span>`
      : c.status === 'premium'
        ? `<span class="badge premium">⭐ ${esc(L.prem)}</span>`
        : `<span class="badge soon">🔒 ${esc(L.soon)}</span>`;
    const customBadge = c.custom
      ? `<span class="badge made" style="left:auto;right:8px;top:auto;bottom:8px">${c.mine ? '💚 ' + esc(L.mine_badge) : '🎨 ' + esc(L.made_badge)}</span>`
      : '';
    // V3.38.0: the Come Closer story-hook under the name ("мать твоего
    // друга") — the bio stays as the smaller descriptive line.
    const hookLine = c.hook ? `<div class="hook">${esc(c.hook)}</div>` : '';
    // V3.40.0: the view badge («👁 427k») — built from esc()'d parts, shown
    // from the first view on; the grid card refreshes after each page open.
    const viewsBadge = c.views ? '<div class="views">👁 ' + esc(fmtK(c.views)) + '</div>' : '';
    // V3.43.1: living tile — a muted looping mp4 (she smiles and blows an air
    // kiss) when the owner rendered one; otherwise the Ken-Burns webp «гифка».
    const cardMedia = c => c.live
      ? `<video src="${esc(c.live)}" muted loop autoplay playsinline preload="metadata" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"></video>`
      : `<img src="${esc(c.card || c.photo)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`;
    return `<div class="card${c.selected ? ' selected' : ''}" data-id="${esc(c.id)}" data-status="${esc(c.status)}" data-name="${esc(c.name)}" data-photo="${esc(c.photo)}" data-emoji="${esc(c.emoji)}" data-custom="${c.custom ? '1' : '0'}">
      <div class="photo">
        ${cardMedia(c)}
        <div class="fallback">${esc(c.emoji)}</div>
        ${badge}${viewsBadge}${c.selected ? `<span class="badge" style="left:8px;top:auto;bottom:8px;color:#e8447f">❤️</span>` : ''}${customBadge}
      </div>
      <div class="body">
        <div class="name">${esc(c.name)}</div>
        <div class="age">${esc(c.age)} ${esc(L.years)}</div>
        ${hookLine}
        <div class="bio">${esc(c.bio)}</div>
      </div>
    </div>`;
  }).join('');
  const createCard = CHAR_SEG === 'official' ? '' : (hasMine
    ? `<div class="card create" style="opacity:.75">
        <div class="photo" style="display:flex;align-items:center;justify-content:center"><div class="plus">🎨</div></div>
        <div class="body"><div class="lbl2">${esc(L.mychar_note)}</div></div>
      </div>`
    : `<div class="card create" id="createCard">
        <div class="photo" style="display:flex;align-items:center;justify-content:center"><div class="plus">➕</div></div>
        <div class="body"><div class="lbl2">${esc(L.create_own)}</div><div class="sub2">${esc(L.create_sub)}</div></div>
      </div>`);
  grid.innerHTML = cards + createCard;
  // V3.43.2: WebView does not always honour the autoplay attribute — kick
  // every living tile by hand, and pause the ones scrolled off screen so
  // eight mp4 loops do not drag the grid down.
  const liveIO = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) e.target.play().catch(() => {}); else e.target.pause();
  }), {threshold: .25}) : null;
  grid.querySelectorAll('video').forEach(v => { if (liveIO) liveIO.observe(v); v.play().catch(() => {}); });
  grid.querySelectorAll('.card[data-id]').forEach(el =>
    el.addEventListener('click', () => openCharPage(el)));
  const cc = document.getElementById('createCard');
  if (cc) cc.addEventListener('click', openWizard);
  // V3.38.0: the profile «MY CHARACTERS» block lists mine cards — re-render
  // it once the grid data arrives (loadMe usually finishes first).
  if (ME) renderProfileBody();
}

async function loadCharacters() {
  try {

    const q = tg.initData ? ('?init_data=' + encodeURIComponent(tg.initData)) : '';

function fmtTime(ts) {
  if (!ts) return '';
  try {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (e) { return ''; }
}

function fmtK(n) {
  // V3.40.0: compact view counts for the card badge — 427 stays «427»,
  // 42700 becomes «43k», 1200000 becomes «1.2M» (Come Closer badge vibe).
  n = n || 0;
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
  if (n >= 1000) return Math.round(n / 1000) + 'k';
  return String(n);
}

function chatBubble(roleOrM, content, ts) {
  // V3.39.0: media messages (photo / circle / voice) render like in the bot
  // dialog — round video for circles, a player for voice, a photo otherwise.
  const m = (roleOrM && typeof roleOrM === 'object') ? roleOrM : { role: roleOrM, content: content, ts: ts };
  const t = fmtTime(m.ts) ? `<span class="t">${esc(fmtTime(m.ts))}</span>` : '';
  const cls = m.role === 'user' ? 'user' : 'bot';
  let body = esc(m.content);
  if (m.media_url) {
    const src = m.media_url + '?init_data=' + encodeURIComponent(tg.initData || '');
    if (m.media_kind === 'circle') body = `<video class="circle" src="${esc(src)}" loop autoplay muted playsinline></video>`;
    else if (m.media_kind === 'video') body = `<video class="m" src="${esc(src)}" controls playsinline></video>`;
    else if (m.media_kind === 'voice') body = `<audio controls src="${esc(src)}"></audio>`;
    else body = `<img class="m" src="${esc(src)}" data-lb="1" alt="">`;
    if (m.content) body += `<div style="margin-top:4px">${esc(m.content)}</div>`;
  }
  return `<div class="msg ${cls}">${body}${t}</div>`;
}

async function loadChatHistory(characterId) {
  try {
    const r = await fetch('/webapp/api/chat?init_data=' + encodeURIComponent(tg.initData || '') + '&character_id=' + encodeURIComponent(characterId));
    if (r.status === 401) { toast(L.auth_short); return; }
    const j = await r.json();
    const box = document.getElementById('chatMsgs');
    if (!j.ok) { box.innerHTML = `<div class="chat-empty">${esc(L.reply_err)}</div>`; return; }
    if (!j.history.length) { box.innerHTML = `<div class="chat-empty">${esc(L.empty_chat)}</div>`; return; }
    box.innerHTML = j.history.map(m => chatBubble(m)).join('');
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    document.getElementById('chatMsgs').innerHTML = `<div class="chat-empty">${esc(L.empty_chat)}</div>`;
  }
}

async function sendChat() {
  if (!CHAT || chatBusy) return;
  const input = document.getElementById('chatText');
  const text = input.value.trim();
  if (!text) return;
  if (!tg.initData) { toast(L.auth_short); return; }
  chatBusy = true;
  input.value = '';
  const box = document.getElementById('chatMsgs');
  const empty = box.querySelector('.chat-empty');
  if (empty) empty.remove();
  box.insertAdjacentHTML('beforeend', chatBubble('user', text, null));
  box.insertAdjacentHTML('beforeend', `<div class="typing" id="chatTyping">${esc(CHAT.name)} …</div>`);
  box.scrollTop = box.scrollHeight;
  try {
    const r = await fetch('/webapp/api/chat?init_data=' + encodeURIComponent(tg.initData), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ character_id: CHAT.id, text: text }),
    });
    if (r.status === 401) { toast(L.auth_short); return; }
    if (r.status === 429) { toast(L.limit_reached); showTab('shop'); return; }
    if (r.status === 403) {
      const j = await r.json().catch(() => ({}));
      toast(j.error === 'consent' ? L.consent_needed : (j.error === 'premium_required' ? L.need_premium : L.locked));
      if (j.error === 'premium_required') showTab('shop');
      return;
    }
    const j = await r.json();
    if (!j.ok) { toast(L.reply_err); return; }
    box.insertAdjacentHTML('beforeend', chatBubble('bot', j.reply, null));
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    toast(L.reply_err);
  } finally {
    const typing = document.getElementById('chatTyping');
    if (typing) typing.remove();
    chatBusy = false;
    input.focus();
  }
}

// ── V3.39.0: in-app chat media — photos, circles, voice like the bot dialog ──
let mediaBusy = false;
async function requestMedia(kind, scene) {
  if (!CHAT || mediaBusy) return;
  if (!tg.initData) { toast(L.auth_short); return; }
  mediaBusy = true;
  document.querySelectorAll('.chat-media button').forEach(b => b.disabled = true);
  const box = document.getElementById('chatMsgs');
  const empty = box.querySelector('.chat-empty');
  if (empty) empty.remove();
  const wait = kind === 'circle' ? L.media_wait_circle : (kind === 'video' ? L.media_wait_video : (kind === 'voice' ? L.media_wait_voice : L.media_wait_photo));
  box.insertAdjacentHTML('beforeend', `<div class="typing" id="mediaTyping">${esc(wait)}</div>`);
  box.scrollTop = box.scrollHeight;
  try {
    const r = await fetch('/webapp/api/chat/media?init_data=' + encodeURIComponent(tg.initData), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ character_id: CHAT.id, kind: kind, scene: scene || '' }),
    });
    if (r.status === 401) { toast(L.auth_short); return; }
    if (r.status === 402) {
      const j = await r.json().catch(() => ({}));
      toast(j.error === 'circle_limit' ? L.circle_limit : L.pic_no_credits);
      if (j.error !== 'circle_limit') showTab('shop');
      return;
    }
    if (r.status === 403) {
      const j = await r.json().catch(() => ({}));
      toast(j.error === 'consent' ? L.consent_needed : (j.error === 'adult_confirm' ? L.adult_confirm_needed :
        (j.error === 'premium_required' ? L.need_premium : L.locked)));
      if (j.error === 'premium_required') showTab('shop');
      return;
    }
    const j = await r.json();
    if (!j.ok) { toast(L.reply_err); return; }
    box.insertAdjacentHTML('beforeend', chatBubble({ role: 'bot', content: j.content, media_kind: j.kind, media_url: j.url, ts: null }));
    box.scrollTop = box.scrollHeight;
    if (ME && j.credits_left != null) ME.photo_credits = j.credits_left;
  } catch (e) {
    toast(L.reply_err);
  } finally {
    const t2 = document.getElementById('mediaTyping');
    if (t2) t2.remove();
    mediaBusy = false;
    document.querySelectorAll('.chat-media button').forEach(b => b.disabled = false);
  }
}

// ── V3.41.0: app-chat feature sheet — apartment / date / daily quest ───────
// One overlay renders all three menus from /webapp/api/feature; taps post to
// /webapp/api/feature/action. Built with string concatenation + esc() so every
// dynamic value is escaped (no raw template interpolation).
function closeFeature() { document.getElementById('featview').classList.remove('open'); }

function featItemHtml(kind, it) {
  const locked = it.locked ? ' locked' : '';
  const lockFlag = it.locked ? '1' : '0';
  const costHtml = (kind === 'date' && !it.locked) ? ('<div class="fec">' + esc(it.cost) + '\u2b50</div>') : '';
  const doneHtml = (kind === 'date' && it.done) ? ' \u2705' : '';
  let actsHtml = '';
  if (kind === 'apartment' && !it.locked) {
    actsHtml = '<div class="featactions" id="act_' + esc(it.id) + '">' +
      (it.actions || []).map(a => '<button data-room="' + esc(it.id) + '" data-act="' + esc(a.id) + '">' + esc(a.title) + '</button>').join('') +
      '</div>';
  }
  return '<div class="featitem' + locked + '" data-id="' + esc(it.id) + '" data-locked="' + lockFlag + '" data-hint="' + esc(it.subtitle || '') + '">' +
    '<div class="fem">' + esc(it.emoji) + '</div>' +
    '<div class="fet"><div class="fen">' + esc(it.title) + doneHtml + '</div><div class="fes">' + esc(it.subtitle || '') + '</div></div>' +
    costHtml + '</div>' + actsHtml;
}

function toggleRoomActions(el) {
  const box = document.getElementById('act_' + el.dataset.id);
  if (!box) return;
  const willOpen = !box.classList.contains('open');
  document.querySelectorAll('.featactions').forEach(a => a.classList.remove('open'));
  if (willOpen) box.classList.add('open');
}

// V3.43.7: the scene menu behind the app-chat «📸 Фото» button — grouped
// like the bot's photo keyboard (everyday / fashion / evening / private).
// The backend sends ids + lock state (relationship level); the labels come
// from the interface language. Built with string concatenation + esc() so
// every dynamic value is escaped (no raw template interpolation).
const SCENE_GROUPS = [
  { key: 'everyday', scenes: ['selfie', 'home', 'park', 'cafe', 'street', 'shop', 'car', 'gym', 'cinema', 'embankment'] },
  { key: 'fashion', scenes: ['mirror', 'outfit', 'fashion'] },
  { key: 'evening', scenes: ['restaurant', 'evening', 'bar', 'karaoke', 'rooftop', 'club'] },
  { key: 'private', scenes: ['personal', 'lingerie', 'private_fashion'] },
];

function renderPhotoScenes(j) {
  const box = document.getElementById('featBody');
  const byId = {};
  (j.items || []).forEach(it => { byId[it.id] = it; });
  let html = '<div class="featlist">';
  SCENE_GROUPS.forEach(g => {
    html += '<div class="featgroup">' + esc(L['scg_' + g.key]) + '</div>';
    g.scenes.forEach(id => {
      const it = byId[id];
      if (!it) return;
      const sub = it.locked ? String(L.sc_locked(it.min_level)) : '';
      html += '<div class="featitem' + (it.locked ? ' locked' : '') + '" data-scene="' + esc(id) +
        '" data-locked="' + (it.locked ? '1' : '0') + '" data-hint="' + esc(sub) + '">' +
        '<div class="fet"><div class="fen">' + esc(typeof L['sc_' + id] === 'string' ? L['sc_' + id] : id) + '</div>' +
        (sub ? '<div class="fes">' + esc(sub) + '</div>' : '') + '</div></div>';
    });
  });
  html += '</div>';
  box.innerHTML = html;
  box.querySelectorAll('.featitem').forEach(el => {
    el.addEventListener('click', () => {
      if (el.dataset.locked === '1') { toast(el.dataset.hint || L.locked); return; }
      closeFeature();
      requestMedia('photo', el.dataset.scene);
    });
  });
}

function renderFeature(j) {
  const box = document.getElementById('featBody');
  if (j.kind === 'photo') { renderPhotoScenes(j); return; }
  if (j.kind === 'quest') {
    const done = j.claimed;
    box.innerHTML = '<div class="featquest"><div class="qtext">\ud83c\udfaf ' + esc(j.text) + '</div>' +
      '<button class="featdone" id="questDone"' + (done ? ' disabled' : '') + '>' +
      esc(done ? L.feat_claimed : L.feat_done_btn) + '</button></div>';
    const qbtn = document.getElementById('questDone');
    if (qbtn && !done) qbtn.addEventListener('click', () => featurePost({ kind: 'quest' }));
    return;
  }
  const items = j.items || [];
  if (!items.length) { box.innerHTML = '<div class="chat-empty">' + esc(L.feat_empty) + '</div>'; return; }
  box.innerHTML = '<div class="featlist">' + items.map(it => featItemHtml(j.kind, it)).join('') + '</div>';
  box.querySelectorAll('.featitem').forEach(el => {
    el.addEventListener('click', () => {
      if (el.dataset.locked === '1') { toast(el.dataset.hint || L.locked); return; }
      if (j.kind === 'apartment') toggleRoomActions(el);
      else if (j.kind === 'date') featurePost({ kind: 'date', id: el.dataset.id });
    });
  });
  box.querySelectorAll('.featactions button').forEach(b => {
    b.addEventListener('click', (ev) => {
      ev.stopPropagation();
      featurePost({ kind: 'apartment', id: b.dataset.room, action_id: b.dataset.act });
    });
  });
}

async function openFeature(kind) {
  if (!CHAT) return;
  if (!tg.initData) { toast(L.auth_short); return; }
  document.getElementById('featBody').innerHTML = '<div class="loading">' + esc(L.loading) + '</div>';
  document.getElementById('featTitle').textContent = '';
  document.getElementById('featview').classList.add('open');
  try {
    const r = await fetch('/webapp/api/feature?init_data=' + encodeURIComponent(tg.initData) +
      '&kind=' + encodeURIComponent(kind) + '&character_id=' + encodeURIComponent(CHAT.id));
    if (r.status === 401) { toast(L.auth_short); closeFeature(); return; }
    const j = await r.json();
    if (!j.ok) { document.getElementById('featBody').innerHTML = '<div class="chat-empty">' + esc(L.reply_err) + '</div>'; return; }
    document.getElementById('featTitle').textContent = (kind === 'photo') ? L.photo_menu_title : (j.title || '');
    renderFeature(j);
  } catch (e) {
    document.getElementById('featBody').innerHTML = '<div class="chat-empty">' + esc(L.reply_err) + '</div>';
  }
}

async function featurePost(payload) {
  if (!CHAT || !tg.initData) { toast(L.auth_short); return; }
  payload.character_id = CHAT.id;
  const box = document.getElementById('chatMsgs');
  try {
    const r = await fetch('/webapp/api/feature/action?init_data=' + encodeURIComponent(tg.initData), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
    });
    if (r.status === 401) { toast(L.auth_short); return; }
    if (r.status === 403) {
      const je = await r.json().catch(() => ({}));
      toast(je.error === 'consent' ? L.consent_needed : (je.error === 'premium_required' ? L.need_premium : L.locked));
      return;
    }
    if (r.status === 409) { toast(L.feat_claimed); return; }
    const j = await r.json();
    if (!j.ok) { toast(L.reply_err); return; }
    if (j.invoice) {
      if (typeof tg.openInvoice !== 'function') { toast(L.auth_short); return; }
      closeFeature();
      tg.openInvoice(j.invoice, (status) => {
        if (status === 'paid') { toast(L.feat_paid); if (CHAT) loadChatHistory(CHAT.id); loadMe(); }
        else if (status === 'failed') toast(L.pay_failed);
        else toast(L.pay_cancelled);
      });
      return;
    }
    closeFeature();
    const empty = box.querySelector('.chat-empty'); if (empty) empty.remove();
    if (j.text) box.insertAdjacentHTML('beforeend', chatBubble({ role: 'bot', content: j.text, ts: null }));
    if (j.photo_url) box.insertAdjacentHTML('beforeend', chatBubble({ role: 'bot', content: '', media_kind: 'photo', media_url: j.photo_url, ts: null }));
    box.scrollTop = box.scrollHeight;
  } catch (e) { toast(L.reply_err); }
}

// ── V3.39.0: the Come Closer character page (strip → CTA → bio → СЮЖЕТ) ────
let CHARPAGE = null;
function openCharPage(el) {
  const c = CHARS.find(x => x.id === el.dataset.id);
  if (!c) { openCharacter(el); return; }
  const status = c.status;
  if (status === 'premium' && !(ME && ME.premium)) { toast(L.need_premium); showTab('shop'); return; }
  if (status !== 'active' && status !== 'premium') { toast(L.locked); return; }
  CHARPAGE = c;
  // V3.40.0: count the view and refresh the badge on the grid card behind
  // the overlay (fire-and-forget — a stats hiccup must never block the page).
  fetch('/webapp/api/char_view?init_data=' + encodeURIComponent(tg.initData || ''), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ character_id: c.id }),
  }).then(r => r.json()).then(j => {
    if (!j.ok) return;
    c.views = j.views;
    const cardEl = document.querySelector('.card[data-id="' + c.id + '"]');
    if (!cardEl) return;
    const b = cardEl.querySelector('.views');
    if (b) b.textContent = '👁 ' + fmtK(j.views);
    else cardEl.querySelector('.photo').insertAdjacentHTML('beforeend',
      '<div class="views">👁 ' + esc(fmtK(j.views)) + '</div>');
  }).catch(() => {});
  document.getElementById('charName').textContent = c.name;
  document.getElementById('charSub').textContent = c.custom ? L.made_badge : (status === 'premium' ? L.prem : L.active);
  document.getElementById('charTitle').textContent = c.name;
  document.getElementById('charMeta').textContent =
    `${c.age} ${L.years} · ${status === 'premium' ? L.prem : L.active}` + (c.selected ? ` · ❤️ ${L.selected}` : '');
  const strip = document.getElementById('charStrip');
  const shots = (c.gallery && c.gallery.length) ? c.gallery : [c.photo];
  // V3.43.0: Come Closer carousel — arrows + dots switch the shot while a tap
  // on the photo itself opens the full-screen lightbox (data-lb delegate).
  strip.innerHTML = shots.map((u, i) =>
    `<img src="${esc(u)}" data-lb="1" class="${i === 0 ? 'on' : ''}" alt="">`).join('');
  const dots = document.getElementById('charDots');
  dots.innerHTML = shots.map((u, i) => `<i class="${i === 0 ? 'on' : ''}"></i>`).join('');
  const multi = shots.length > 1;
  document.getElementById('charPrev').style.display = multi ? '' : 'none';
  document.getElementById('charNext').style.display = multi ? '' : 'none';
  dots.style.display = multi ? '' : 'none';
  const setShot = (i) => {
    const imgs = strip.querySelectorAll('img');
    if (!imgs.length) return;
    const idx = (i + imgs.length) % imgs.length;
    imgs.forEach((x, k) => x.classList.toggle('on', k === idx));
    dots.querySelectorAll('i').forEach((x, k) => x.classList.toggle('on', k === idx));
  };
  const curShot = () => [...strip.querySelectorAll('img')].findIndex(x => x.classList.contains('on'));
  document.getElementById('charPrev').onclick = () => setShot(curShot() - 1);
  document.getElementById('charNext').onclick = () => setShot(curShot() + 1);
  dots.querySelectorAll('i').forEach((d, i) => { d.onclick = () => setShot(i); });
  loadLike(c.id);
  document.getElementById('charStart').textContent = '💬 ' + L.start_chat;
  document.getElementById('charBio').textContent = c.bio || '';
  const plot = document.getElementById('charPlot');
  if (c.hook) {
    plot.style.display = '';
    document.getElementById('charPlotLbl').textContent = L.plot;
    document.getElementById('charPlotText').textContent = c.hook;
  } else {
    plot.style.display = 'none';
  }
  const selBtn = document.getElementById('charSelect');
  selBtn.textContent = L.make_mine;
  selBtn.style.display = c.selected ? 'none' : '';
  document.getElementById('charview').classList.add('open');
}

// ── V3.35.0: character constructor wizard ─────────────────────────────────
let WIZ = { steps: [], idx: 0, params: {}, name: '', stars: 0, rub: 0, usd: 0, free: false };

async function openWizard() {
  try {
    const q = tg.initData ? ('?init_data=' + encodeURIComponent(tg.initData) + '&') : '?';
    const r = await fetch('/webapp/api/constructor/options' + q + 'lang=' + LANG);
    const j = await r.json();
    if (!j.ok || !j.steps || !j.steps.length) { toast(L.invoice_err); return; }
    WIZ = { steps: j.steps, idx: 0, params: {}, name: '', stars: j.stars || 0, rub: j.rub || 0, usd: j.usd || 0, free: !!j.free };
    document.getElementById('wizview').classList.add('open');
    renderWizStep();
  } catch (e) {
    toast(L.invoice_err);
  }
}

function renderWizStep() {
  const total = WIZ.steps.length;
  document.getElementById('wizTitle').textContent = L.create_own;
  document.getElementById('wizSub').textContent = L.wiz_step + ' ' + (WIZ.idx + 1) + '/' + (total + 1);
  const body = document.getElementById('wizBody');
  if (WIZ.idx < total) {
    const step = WIZ.steps[WIZ.idx];
    const opts = step.options.map(o =>
      `<button class="opt${WIZ.params[step.key] === o.value ? ' sel' : ''}" data-v="${esc(o.value)}">${esc(o.label)}</button>`).join('');
    body.innerHTML = `
      <div class="step-title">${esc(step.title)}</div>
      <div class="opts">${opts}</div>
      ${WIZ.idx > 0 ? `<button class="cta ghost" id="wizPrev">↩ ${esc(L.wiz_step)}</button>` : ''}`;
    body.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      WIZ.params[WIZ.steps[WIZ.idx].key] = b.dataset.v;
      WIZ.idx += 1;
      renderWizStep();
    }));
    const prev = document.getElementById('wizPrev');
    if (prev) prev.addEventListener('click', () => { WIZ.idx -= 1; renderWizStep(); });
    return;
  }
  // Final step: the name + a review of every choice + the price.
  const review = WIZ.steps.map(s => {
    const chosen = s.options.find(o => o.value === WIZ.params[s.key]);
    return chosen ? `<div>${esc(s.title.replace('?', ''))}: ${esc(chosen.label)}</div>` : '';
  }).filter(Boolean).join('');
  body.innerHTML = `
    <div class="step-title">${esc(L.wiz_name_ph)}</div>
    <input class="name" id="wizName" maxlength="24" value="${esc(WIZ.name)}">
    <div class="review">${review}</div>
    <div class="price-note" id="wizPrice">${WIZ.free ? '✅ ' + esc(L.wiz_free) : '⭐ ' + WIZ.stars + (WIZ.rub ? ' · ' + esc(WIZ.rub) + ' ₽' : '') + (WIZ.usd ? ' · $' + esc(WIZ.usd) : '')}</div>
    <button class="cta" id="wizCreate" ${WIZ.name ? '' : 'disabled'}>🎨 ${esc(L.wiz_create)}</button>`;
  const nameInput = document.getElementById('wizName');
  const createBtn = document.getElementById('wizCreate');
  nameInput.addEventListener('input', () => {
    WIZ.name = nameInput.value.trim();
    createBtn.disabled = !WIZ.name;
  });
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && WIZ.name) submitWizard();
  });
  createBtn.addEventListener('click', submitWizard);
}

async function submitWizard() {
  if (!WIZ.name) return;
  const btn = document.getElementById('wizCreate');
  if (btn) btn.disabled = true;
  try {
    // 1. Save the draft — it lands in the same constructor session the bot
    //    wizard uses, so the payment pipeline is identical.
    const dr = await fetch('/webapp/api/constructor/draft?init_data=' + encodeURIComponent(tg.initData || ''), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ params: WIZ.params, name: WIZ.name }),
    });
    if (dr.status === 401) { toast(L.auth_short); if (btn) btn.disabled = false; return; }
    if (dr.status === 409) { toast(L.wiz_exists); if (btn) btn.disabled = false; return; }
    const dj = await dr.json();
    if (!dj.ok) { toast(L.invoice_err); if (btn) btn.disabled = false; return; }
    // 2. Pay — admins and rub-credit holders get the free path.
    const br = await fetch('/webapp/api/constructor/buy?init_data=' + encodeURIComponent(tg.initData || ''), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({}),
    });
    if (br.status === 401) { toast(L.auth_short); if (btn) btn.disabled = false; return; }
    const bj = await br.json();
    if (!bj.ok) { toast(L.invoice_err); if (btn) btn.disabled = false; return; }
    if (bj.free) {
      closeWizard();
      toast(L.wiz_paid_toast);
      pollCharacters();
      return;
    }
    if (typeof tg.openInvoice !== 'function') { toast(L.auth_short); if (btn) btn.disabled = false; return; }
    tg.openInvoice(bj.link, (status) => {
      if (btn) btn.disabled = false;
      if (status === 'paid') {
        closeWizard();
        toast(L.wiz_paid_toast);
        pollCharacters();
      } else if (status === 'failed') {
        toast(L.pay_failed);
      } else {
        toast(L.pay_cancelled);
      }
    });
  } catch (e) {
    toast(L.invoice_err);
    if (btn) btn.disabled = false;
  }
}

function closeWizard() {
  document.getElementById('wizview').classList.remove('open');
}

let pollTimer = null;
function pollCharacters() {
  // The avatar job takes up to a minute — refresh the grid until she appears.
  let tries = 0;
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    tries += 1;
    await loadCharacters();
    if (tries >= 18) clearInterval(pollTimer);
  }, 5000);
}

// ── V3.38.0: the «Чаты» tab — every dialog in one list ───────────────────
function fmtDay(ts) {
  if (!ts) return '';
  try {
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString([], { day: '2-digit', month: '2-digit' });
  } catch (e) { return ''; }
}

function renderChats(list) {
  const box = document.getElementById('chatsbody');
  if (!list.length) {
    box.innerHTML = `<div class="chat-empty">${esc(L.chats_empty)}</div>`;
    return;
  }
  box.innerHTML = list.map(c => {
    const prev = (c.last_role === 'user' ? '✓ ' : '') + (c.last_message || '…');
    return `<div class="chat-row" data-id="${esc(c.id)}">
      <img class="p" src="${esc(c.photo)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
      <div class="p pdiv" style="display:none">${esc(c.emoji)}</div>
      <div class="mid">
        <div class="nm">${esc(c.name)}</div>
        <div class="prev">${esc(prev)}</div>
      </div>
      <div class="tm">${esc(fmtDay(c.last_ts))}</div>
    </div>`;
  }).join('');
  box.querySelectorAll('.chat-row').forEach(el => el.addEventListener('click', () => {
    const c = list.find(x => x.id === el.dataset.id);
    if (!c) return;
    if (c.status === 'premium' && !(ME && ME.premium)) { toast(L.need_premium); showTab('shop'); return; }
    if (c.status !== 'active' && c.status !== 'premium') { toast(L.locked); return; }
    openChat({
      id: c.id, name: c.name, photo: c.photo, emoji: c.emoji,
      status: c.status, custom: c.custom, selected: c.selected,
    });
  }));
}

async function loadChats() {
  try {
    const r = await fetch('/webapp/api/chats?init_data=' + encodeURIComponent(tg.initData || ''));
    if (r.status === 401) {

async function generatePicture() {
  const btn = document.getElementById('picGen');
  if (btn && btn.disabled) return;
  const prompt = (document.getElementById('picPrompt').value || '').trim();
  const extra = (document.getElementById('picExtra').value || '').trim();
  const full = extra ? prompt + ', ' + extra : prompt;
  if (full.length < 4) { toast(L.pic_prompt_ph); return; }
  if (!tg.initData) { toast(L.auth_short); return; }
  if (btn) btn.disabled = true;
  const result = document.getElementById('picResult');
  result.innerHTML = `<div class="note">${esc(L.pic_wait)}</div>`;
  try {
    const r = await fetch('/webapp/api/picture?init_data=' + encodeURIComponent(tg.initData), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: full,
        style: PIC_STYLE,
        format: document.getElementById('picFormat').value,
      }),
    });
    if (r.status === 401) { toast(L.auth_short); result.innerHTML = ''; if (btn) btn.disabled = false; return; }
    if (r.status === 402) { toast(L.pic_no_credits); showTab('shop'); result.innerHTML = ''; if (btn) btn.disabled = false; return; }
    if (r.status === 403) { toast(L.consent_needed); result.innerHTML = ''; if (btn) btn.disabled = false; return; }
    if (r.status === 400) { toast(L.pic_blocked); result.innerHTML = ''; if (btn) btn.disabled = false; return; }
    const j = await r.json();
    if (!j.ok) { toast(j.reason || L.pic_gen_fail); result.innerHTML = ''; if (btn) btn.disabled = false; return; }
    result.innerHTML = `<img src="${esc(j.file)}?init_data=${encodeURIComponent(tg.initData || '')}" data-lb="1" style="width:100%;border-radius:14px;margin-top:10px;display:block;background:var(--card2)">`;
    toast('🍑 ' + (j.credits_left != null ? j.credits_left : ''));
    loadMe();
    loadPictures();
  } catch (e) {
    toast(L.pic_gen_fail);
    result.innerHTML = '';
  } finally {
    if (btn) btn.disabled = false;
  }
}

let SHOP = null;
function openPay(id) {
  const s = SHOP;
  if (!s) return;
  const x = (s.purchases || []).find(p => p.id === id);
  if (!x) return;
  document.getElementById('payEmo').textContent = x.emoji;

  if (s.wallet_pay) rows.push(`<button class="mrow" data-m="crypto"><span class="ico">💎</span><span class="nm">${esc(L.pay_crypto)}</span><span class="pr">$${esc(x.usd || (x.stars * 0.02).toFixed(2))}</span></button>`);
  document.getElementById('payRows').innerHTML = rows.join('');
  document.querySelectorAll('#payRows [data-m]').forEach(b =>
    b.addEventListener('click', () => payVia(x.id, b.dataset.m, b)));
  document.getElementById('paymodal').classList.add('open');
}
async function payVia(id, method, btn) {
  if (method === 'stars') {
    document.getElementById('paymodal').classList.remove('open');
    buy(id, btn);
    return;
  }
  btn.disabled = true;
  try {
    const r = await fetch('/webapp/api/pay_link?init_data=' + encodeURIComponent(tg.initData || ''), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product: id, method }),
    });
    if (r.status === 401) { toast(L.auth_short); return; }
    const j = await r.json();
    if (!j.ok || !j.url) { toast(L.pay_link_err); return; }
    document.getElementById('paymodal').classList.remove('open');
    if (j.url.indexOf('https://t.me/') === 0 && typeof tg.openTelegramLink === 'function') tg.openTelegramLink(j.url);
    else if (typeof tg.openLink === 'function') tg.openLink(j.url);
    else window.open(j.url, '_blank');
    toast(L.pay_opened);
  } catch (e) {
    toast(L.pay_link_err);
  } finally {
    btn.disabled = false;
  }
}
document.getElementById('payClose').addEventListener('click', () => document.getElementById('paymodal').classList.remove('open'));

      try { tg.showAlert(link); } catch (e) { toast(L.copy_fail); }

async function withdrawPartner() {
  const btn = document.getElementById('pWithdraw');
  if (btn) btn.disabled = true;
  try {
    const r = await fetch('/webapp/api/partner/withdraw?init_data=' + encodeURIComponent(tg.initData || ''), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
    });
    if (r.status === 401) { toast(L.auth_short); if (btn) btn.disabled = false; return; }
    if (r.status === 409) { toast(L.wd_pending); if (btn) btn.disabled = false; return; }
    if (r.status === 400) { toast(L.wd_below(PARTNER.min_payout_rub)); if (btn) btn.disabled = false; return; }
    const j = await r.json();
    if (!j.ok) { toast(L.wd_fail); if (btn) btn.disabled = false; return; }
    toast(L.wd_ok);
    loadPartner();

    toast(L.wd_fail);

      <details class="doc"><summary>🔐 ${esc(L.privacy)}</summary><div class="txt">${esc(d.privacy)}</div></details>
      <details class="doc"><summary>📄 ${esc(L.agreement)}</summary><div class="txt">${esc(d.agreement)}</div></details>
      <details class="doc"><summary>💰 ${esc(L.tariffs)}</summary><div class="txt">${esc(d.tariffs)}</div></details>
      <details class="doc"><summary>🛟 ${esc(L.support)}</summary><div class="txt">${esc(d.support)}</div></details>`;
  } catch (e) {
    document.getElementById('docsbody').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

// ── V3.43.0: auth failures are no longer a dead end ───────────────────────
// Say WHY it failed (opened outside Telegram vs stale initData) and offer a
// one-tap retry instead of a bare error line.
function authErrHtml() {
  const msg = (tg.initData || '').trim() ? L.err_auth_retry : L.err_auth_out;
  return `<div class="err">${msg}<br><button class="cta small" style="margin-top:10px" onclick="location.reload()">${L.err_auth_btn}</button></div>`;
}

// ── V3.43.0: full-screen lightbox — tap a photo and it opens ──────────────
const lbRoot = document.getElementById('lightbox');
function openLightbox(src) {
  document.getElementById('lbImg').src = src;
  lbRoot.classList.add('open');
}
document.getElementById('lbClose').addEventListener('click', () => lbRoot.classList.remove('open'));
lbRoot.addEventListener('click', e => { if (e.target === lbRoot) lbRoot.classList.remove('open'); });
document.addEventListener('click', e => {
  const img = e.target && e.target.closest ? e.target.closest('img[data-lb]') : null;
  if (img && img.src) openLightbox(img.src);
});

// ── V3.43.0: the character-page like («♡ 189» on the benchmarked card) ────
const LIKECACHE = {};
function setLikeUi(st) {
  const b = document.getElementById('charLike');
  b.textContent = (st.liked ? '❤️ ' : '♡ ') + (st.count || 0);
  b.classList.toggle('on', !!st.liked);
}
async function loadLike(charId) {
  const btn = document.getElementById('charLike');
  btn.dataset.char = charId;
  setLikeUi(LIKECACHE[charId] || { count: 0, liked: false });
  try {
    const r = await fetch('/webapp/api/char_like?init_data=' + encodeURIComponent(tg.initData || '') + '&character_id=' + encodeURIComponent(charId));
    const j = await r.json();
    if (j.ok) {
      LIKECACHE[charId] = { count: j.count, liked: j.liked };
      if (btn.dataset.char === charId) setLikeUi(LIKECACHE[charId]);
    }
  } catch (e) { /* the like badge is decorative — never block the page */ }
}
document.getElementById('charLike').addEventListener('click', async () => {
  const charId = document.getElementById('charLike').dataset.char;
  if (!charId) return;
  try {
    const r = await fetch('/webapp/api/char_like?init_data=' + encodeURIComponent(tg.initData || '') + '&character_id=' + encodeURIComponent(charId), { method: 'POST' });
    if (r.status === 401) { toast(L.auth_short); return; }
    const j = await r.json();
    if (j.ok) { LIKECACHE[charId] = { count: j.count, liked: j.liked }; setLikeUi(LIKECACHE[charId]); }
  } catch (e) { toast(L.reply_err); }
});

// ── V3.43.0: channel-subscribe peach bonus (banner + gift modal) ──────────
let CHAN = { url: 'https://t.me/Anna634212', bonus: 100, granted: false };
async function loadChannel() {
  try {
    const r = await fetch('/webapp/api/channel_bonus?init_data=' + encodeURIComponent(tg.initData || ''));
    const j = await r.json();
    if (j.ok) CHAN = { url: j.url || CHAN.url, bonus: j.bonus != null ? j.bonus : CHAN.bonus, granted: !!j.granted };
  } catch (e) { /* the modal still opens with the defaults */ }
  document.getElementById('chanText').textContent = L.chan_text(CHAN.bonus);
}
document.getElementById('chanBanner').addEventListener('click', () => {
  document.getElementById('chanText').textContent = L.chan_text(CHAN.bonus);
  document.getElementById('chanmodal').classList.add('open');
});
document.getElementById('chanClose').addEventListener('click', () => document.getElementById('chanmodal').classList.remove('open'));
document.getElementById('chanGo').addEventListener('click', () => {
  if (typeof tg.openTelegramLink === 'function') tg.openTelegramLink(CHAN.url);
  else window.open(CHAN.url, '_blank');
});
let chanChecking = false;
document.getElementById('chanCheck').addEventListener('click', async () => {
  if (chanChecking) return;
  chanChecking = true;
  try {
    const r = await fetch('/webapp/api/channel_bonus?init_data=' + encodeURIComponent(tg.initData || ''), { method: 'POST' });
    if (r.status === 401) { toast(L.auth_short); return; }
    if (r.status === 502) { toast(L.chan_check_fail); return; }
    const j = await r.json();
    if (!j.ok) { toast(L.chan_check_fail); return; }
    CHAN.granted = !!j.granted || !!j.already;
    if (j.granted) toast(L.chan_ok(j.bonus != null ? j.bonus : CHAN.bonus));
    else if (j.already) toast(L.chan_already);
    else if (j.revoked) toast(L.chan_revoked);
    else toast(L.chan_not);
    loadMe();
  } catch (e) {
    toast(L.chan_check_fail);
  } finally {
    chanChecking = false;
  }
});

renderStudio();
loadMe();
loadCharacters();
loadShop();
loadChats();
loadPictures();
loadChannel();

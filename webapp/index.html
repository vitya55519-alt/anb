<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnnaBot</title>
<!-- The official Telegram WebApp SDK. It is the platform bridge (tg.*) and
     is intentionally NOT SRI-pinned: Telegram serves it unversioned and updates
     it in place, so a pinned hash would break the Mini App on their next
     release. Inside the Telegram client the client-side copy takes precedence
     anyway; this tag is the fallback for external browsers. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #1a1023;
    --bg2: #221430;
    --card: #2b1a3d;
    --card2: #33204a;
    --accent: #e8447f;
    --accent2: #b844e8;
    --text: #f5eef8;
    --muted: #a894bd;
    --ok: #4cd97b;
    --premium: #ffcf5c;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 76px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    background: rgba(26, 16, 35, .92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(232, 68, 127, .18);
  }
  header .logo {
    font-size: 20px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header .chip {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
    background: var(--card); border-radius: 20px; padding: 6px 12px;
  }
  header .chip.premium { color: var(--premium); }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  section.tab { display: none; animation: fade .18s ease; }
  section.tab.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  h2 { font-size: 17px; margin: 4px 0 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: var(--card); border-radius: var(--radius);
    overflow: hidden; border: 1px solid rgba(255,255,255,.05);
    transition: transform .12s ease;
  }
  .card.selected { border: 2px solid var(--accent); }
  .card .photo { position: relative; aspect-ratio: 3/4; background: var(--card2); }
  .card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .photo .fallback {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; font-size: 64px;
  }
  .card .badge {
    position: absolute; top: 8px; left: 8px;
    font-size: 11px; padding: 3px 9px; border-radius: 12px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
  }
  .card .badge.active { color: var(--ok); }
  .card .badge.premium { color: var(--premium); }
  .card .badge.soon { color: var(--muted); }
  .card .body { padding: 10px 12px 12px; }
  .card .name { font-weight: 600; font-size: 15px; }
  .card .age { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  .card .bio { color: var(--muted); font-size: 12px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .hero {
    background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
    border: 1px solid rgba(255, 207, 92, .25);
  }
  .hero .title { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; color: var(--premium); }
  .hero .price { font-size: 26px; font-weight: 800; margin: 10px 0 2px; }
  .hero .price small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .hero ul { list-style: none; margin-top: 12px; }
  .hero li { display: flex; gap: 8px; font-size: 13px; padding: 4px 0; color: var(--text); }
  .note {
    font-size: 12px; color: var(--muted); text-align: center; padding: 10px;
    background: var(--card); border-radius: 12px; margin-top: 12px;
  }
  .row-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
  }
  .row-item .n { font-size: 14px; }
  .row-item .c { color: var(--premium); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .card { cursor: pointer; }
  .card:active { transform: scale(.97); }
  .cta {
    display: block; width: 100%; border: none; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff; font-size: 15px; font-weight: 700;
    padding: 12px; border-radius: 12px; margin-top: 12px;
  }
  .cta:active { transform: scale(.98); }
  .cta:disabled { opacity: .55; }
  .cta.small { width: auto; margin: 0; padding: 8px 14px; font-size: 13px; }
  .cta.ghost { background: transparent; border: 1px solid rgba(232, 68, 127, .5); margin-top: 8px; }
  .row-item .buy-cell { display: flex; align-items: center; gap: 10px; }
  #toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-90px);
    background: rgba(20, 12, 28, .96); color: var(--text);
    border: 1px solid rgba(232, 68, 127, .35); border-radius: 14px;
    padding: 10px 16px; font-size: 13px; z-index: 50; max-width: 86vw; text-align: center;
    transition: transform .22s ease; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  .profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; flex-shrink: 0;
  }
  .profile-head .nm { font-size: 18px; font-weight: 700; }
  .profile-head .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .stat {
    background: var(--card); border-radius: 12px; padding: 14px;
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .stat .k { color: var(--muted); font-size: 13px; }
  .stat .v { font-weight: 700; font-size: 15px; }
  .bar { height: 8px; background: var(--card2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  details.doc {
    background: var(--card); border-radius: 12px; margin-bottom: 10px; overflow: hidden;
  }
  details.doc summary {
    padding: 14px; font-weight: 600; font-size: 14px; cursor: pointer; list-style: none;
    display: flex; align-items: center; gap: 8px;
  }
  details.doc summary::-webkit-details-marker { display: none; }
  details.doc summary::after { content: '›'; margin-left: auto; transform: rotate(90deg); transition: transform .15s; }
  details.doc[open] summary::after { transform: rotate(-90deg); }
  details.doc .txt {
    padding: 0 14px 14px; font-size: 12.5px; line-height: 1.55; color: var(--text);
    white-space: pre-wrap; word-break: break-word; max-height: 60vh; overflow-y: auto;
  }
  .checkword {
    text-align: center; color: var(--muted); font-size: 12px; padding: 8px 0 14px;
  }
  .loading { text-align: center; color: var(--muted); padding: 48px 0; font-size: 14px; }
  .err { text-align: center; color: var(--accent); padding: 48px 16px; font-size: 14px; line-height: 1.5; }
  nav#bottomnav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: flex; background: rgba(20, 12, 28, .96);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(232, 68, 127, .18);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  nav#bottomnav button {
    flex: 1; background: none; border: none; color: var(--muted);
    font-size: 11px; padding: 8px 4px; border-radius: 12px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav#bottomnav button .ico { font-size: 21px; }
  nav#bottomnav button.on { color: var(--accent); background: rgba(232, 68, 127, .12); }
  /* V3.35.0: full-screen overlays — in-app chat and the character wizard */
  .overlay {
    position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; background: var(--bg);
  }
  .overlay.open { display: flex; }
  .chat-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: rgba(26, 16, 35, .96); border-bottom: 1px solid rgba(232, 68, 127, .18);
    flex-shrink: 0;
  }
  .chat-head .p {
    width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
    background: var(--card2); flex-shrink: 0;
  }
  .chat-head .p.pdiv { display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .chat-head .nm { font-weight: 700; font-size: 15px; }
  .chat-head .sub { color: var(--muted); font-size: 11px; }
  .chat-head .spacer { margin-left: auto; }
  .chat-head .iconbtn {
    background: var(--card); border: none; color: var(--text); font-size: 18px;
    border-radius: 12px; padding: 8px 12px; cursor: pointer;
  }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg {
    max-width: 82%; padding: 9px 12px; border-radius: 16px; font-size: 14px;
    line-height: 1.45; word-break: break-word; white-space: pre-wrap;
  }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card); border-bottom-left-radius: 4px; }
  .msg .t { display: block; font-size: 10px; opacity: .6; margin-top: 4px; }
  .chat-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 20px; line-height: 1.5; }
  .chat-input {
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(20, 12, 28, .96); border-top: 1px solid rgba(232, 68, 127, .18); flex-shrink: 0;
  }
  .chat-input input {
    flex: 1; background: var(--card); border: 1px solid rgba(255,255,255,.08);
    color: var(--text); font-size: 15px; padding: 11px 14px; border-radius: 14px; outline: none;
  }
  .chat-input button {
    background: linear-gradient(90deg, var(--accent), var(--accent2)); border: none; color: #fff;
    font-size: 16px; padding: 0 18px; border-radius: 14px; cursor: pointer;
  }
  .chat-input button:disabled { opacity: .5; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 4px 12px; }
  .wiz { flex: 1; overflow-y: auto; padding: 16px; }
  .wiz .step-title { font-size: 17px; font-weight: 700; margin: 6px 0 12px; }
  .wiz .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .wiz .opt {
    background: var(--card); border: 1px solid rgba(255,255,255,.08); color: var(--text);
    font-size: 14px; padding: 10px 14px; border-radius: 14px; cursor: pointer;
  }
  .wiz .opt.sel { border-color: var(--accent); background: rgba(232, 68, 127, .14); }
  .wiz input.name {
    width: 100%; background: var(--card); border: 1px solid rgba(255,255,255,.08);
    color: var(--text); font-size: 15px; padding: 12px 14px; border-radius: 14px;
    outline: none; margin: 8px 0 4px;
  }
  .wiz .review { font-size: 13px; color: var(--muted); line-height: 1.7; margin: 10px 0; }
  .wiz .price-note { color: var(--premium); font-size: 13px; margin: 8px 0 4px; }
  .card.create .plus { font-size: 40px; }
  .card.create .lbl2 { font-weight: 600; font-size: 15px; }
  .card.create .sub2 { color: var(--muted); font-size: 12px; margin-top: 4px; padding: 0 12px 14px; }
  .badge.made { color: var(--accent2); }
</style>
</head>
<body>
<header>
  <div class="logo">AnnaBot</div>
  <div class="chip" id="userchip">…</div>
</header>
<main>
  <section class="tab" id="tab-characters">
    <h2 id="l_chars_title">Персонажи</h2>
    <div class="grid" id="chargrid"><div class="loading" id="l_loading">Загрузка…</div></div>
    <div class="note" id="l_chars_hint">Выбрать девушку для общения можно в чате бота — раздел «Персонажи»</div>
  </section>
  <section class="tab" id="tab-shop">
    <h2 id="l_shop_title">Магазин</h2>
    <div id="shopbody"><div class="loading">…</div></div>
  </section>
  <section class="tab" id="tab-profile">
    <h2 id="l_profile_title">Профиль</h2>
    <div id="profilebody"><div class="loading">…</div></div>
  </section>
  <section class="tab" id="tab-docs">
    <h2 id="l_docs_title">Документы и цены</h2>
    <div class="checkword" id="checkword"></div>
    <div id="docsbody"><div class="loading">…</div></div>
  </section>
</main>
<nav id="bottomnav">
  <button data-tab="characters" class="on"><span class="ico">👩</span><span class="lbl">Персонажи</span></button>
  <button data-tab="shop"><span class="ico">🛒</span><span class="lbl">Магазин</span></button>
  <button data-tab="profile"><span class="ico">👤</span><span class="lbl">Профиль</span></button>
  <button data-tab="docs"><span class="ico">📜</span><span class="lbl">Документы</span></button>
</nav>
<div id="toast"></div>
<!-- V3.35.0: in-app chat — tap a card opens the dialog (shared with the bot chat) -->
<div class="overlay" id="chatview">
  <div class="chat-head">
    <button class="iconbtn" id="chatBack">‹</button>
    <img class="p" id="chatPhoto" alt="" style="display:none">
    <div class="p pdiv" id="chatEmoji">👩</div>
    <div>
      <div class="nm" id="chatName"></div>
      <div class="sub" id="chatSub"></div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="chatSelect" style="font-size:13px">❤️</button>
  </div>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div class="chat-input">
    <input id="chatText" maxlength="4000" placeholder="">
    <button id="chatSend">➤</button>
  </div>
</div>
<!-- V3.35.0: character constructor wizard — build your own girl in the app -->
<div class="overlay" id="wizview">
  <div class="chat-head">
    <button class="iconbtn" id="wizBack">‹</button>
    <div>
      <div class="nm" id="wizTitle"></div>
      <div class="sub" id="wizSub"></div>
    </div>
  </div>
  <div class="wiz" id="wizBody"></div>
</div>
<script>
const tg = window.Telegram.WebApp;
tg.ready();
try { tg.expand(); } catch (e) {}
try { tg.setHeaderColor('#1a1023'); tg.setBackgroundColor('#1a1023'); } catch (e) {}

const user0 = (tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
const LANG = String(user0.language_code || 'ru').toLowerCase().startsWith('en') ? 'en' : 'ru';

const L = LANG === 'en' ? {
  chars_title: 'Characters', loading: 'Loading…',
  chars_hint: 'Tap a card — the dialog opens right here. History is shared with the bot chat.',
  active: 'available', prem: 'Premium', soon: 'soon', selected: 'your girl', years: 'y.o.',
  shop_title: 'Shop', month: '/ 30 days', week: '7 days', pay_hint: 'Stars payments happen right here. Card or crypto — in the bot chat. Prices are the same.',
  free_tier: 'Free tier', msg_day: 'messages per day', photos_day: 'photos per day',
  profile_title: 'Profile', premium_on: 'Premium active', premium_off: 'Free account',
  streak: 'day streak', level: 'relationship level', selected_girl: 'selected girl',
  open_bot: 'Open the bot to chat 💬',
  docs_title: 'Documents & prices', checkword: 'code word',
  privacy: 'Privacy policy', agreement: 'User agreement', tariffs: 'Prices & tariffs', support: 'Support',
  err_auth: 'Could not confirm your Telegram account.<br>Open this app from the bot’s profile.',
  buy: 'Buy', auth_short: 'Open this app from Telegram',
  selected_toast: 'selected', locked: 'This girl is locked for now', need_premium: 'Available with Premium ⭐',
  paid_prem: 'Premium activated ✨', paid_credit: 'Photo credit added 📸',
  pay_failed: 'Payment failed', pay_cancelled: 'Payment cancelled',
  invoice_err: 'Could not open payment — try again',
  input_ph: 'Type a message…', send: 'Send',
  empty_chat: 'Send the first message — she replies right here',
  limit_reached: 'Daily free-message limit reached. Premium lifts it ⭐',
  consent_needed: 'Confirm 18+ first — open the bot and press /start',
  set_main: 'Set as your girl', reply_err: 'Could not reply — try again',
  create_own: 'Create your own', create_sub: 'Looks, figure and personality — she chats the way you pick',
  wiz_step: 'Step', wiz_name_ph: 'Her name? (up to 24 characters)', wiz_create: 'Create',
  wiz_free: 'free (admin)', wiz_paid_toast: 'Drawing your girl — up to a minute. Her card appears in the grid ✨',
  wiz_exists: 'You already have a character — recreate via the bot chat',
  made_badge: 'user-made', mine_badge: 'yours', mychar_note: 'Your character is created 🎨 recreate via the bot chat',
} : {
  chars_title: 'Персонажи', loading: 'Загрузка…',
  chars_hint: 'Нажми на карточку — диалог откроется прямо здесь. История общая с чатом бота.',
  active: 'доступна', prem: 'Premium', soon: 'скоро', selected: 'твоя девушка', years: 'лет',
  shop_title: 'Магазин', month: '/ 30 дней', week: '7 дней', pay_hint: 'Оплата Stars — прямо здесь. Картой или крипто — в чате бота. Цены те же.',
  free_tier: 'Бесплатный функционал', msg_day: 'сообщений в день', photos_day: 'фото в день',
  profile_title: 'Профиль', premium_on: 'Premium активен', premium_off: 'Бесплатный аккаунт',
  streak: 'дней подряд', level: 'уровень отношений', selected_girl: 'выбранная девушка',
  open_bot: 'Открой бота, чтобы общаться 💬',
  docs_title: 'Документы и цены', checkword: 'кодовое слово',
  privacy: 'Политика конфиденциальности', agreement: 'Пользовательское соглашение', tariffs: 'Цены и тарифы', support: 'Поддержка',
  err_auth: 'Не удалось подтвердить твою учётную запись Telegram.<br>Открой приложение из профиля бота.',
  buy: 'Купить', auth_short: 'Открой приложение из Telegram',
  selected_toast: 'выбрана', locked: 'Эта девушка пока закрыта', need_premium: 'Доступна с Premium ⭐',
  paid_prem: 'Premium активирован ✨', paid_credit: 'Фото-кредит начислен 📸',
  pay_failed: 'Оплата не прошла', pay_cancelled: 'Оплата отменена',
  invoice_err: 'Не удалось открыть оплату — попробуй ещё раз',
  input_ph: 'Напиши сообщение…', send: 'Отправить',
  empty_chat: 'Напиши первое сообщение — она ответит прямо здесь',
  limit_reached: 'Дневной лимит бесплатных сообщений. Premium снимает лимит ⭐',
  consent_needed: 'Сначала подтверди 18+ — открой бота и нажми /start',
  set_main: 'Сделать твоей девушкой', reply_err: 'Не получилось ответить — попробуй ещё раз',
  create_own: 'Создать свою', create_sub: 'Внешность, фигура и характер — она будет общаться так, как ты выберешь',
  wiz_step: 'Шаг', wiz_name_ph: 'Как её зовут? (до 24 символов)', wiz_create: 'Создать',
  wiz_free: 'бесплатно (админ)', wiz_paid_toast: 'Рисую твою героиню — до минуты. Карточка появится в сетке ✨',
  wiz_exists: 'Персонаж уже создан — создать заново можно в чате бота',
  made_badge: 'создана игроком', mine_badge: 'твоя', mychar_note: 'Твой персонаж создан 🎨 создать заново можно в чате бота',
};

document.getElementById('l_chars_title').textContent = L.chars_title;
document.getElementById('l_shop_title').textContent = L.shop_title;
document.getElementById('l_profile_title').textContent = L.profile_title;
document.getElementById('l_docs_title').textContent = L.docs_title;
document.getElementById('l_loading').textContent = L.loading;
document.getElementById('l_chars_hint').textContent = L.chars_hint;
document.querySelectorAll('#bottomnav .lbl').forEach((el, i) => {
  el.textContent = ['Персонажи','Магазин','Профиль','Документы'][i];
  if (LANG === 'en') el.textContent = ['Characters','Shop','Profile','Documents'][i];
});

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── tabs ──────────────────────────────────────────────────────────────────
const navBtns = document.querySelectorAll('#bottomnav button');
navBtns.forEach(btn => btn.addEventListener('click', () => {
  navBtns.forEach(b => b.classList.toggle('on', b === btn));
  document.querySelectorAll('section.tab').forEach(s =>
    s.classList.toggle('active', s.id === 'tab-' + btn.dataset.tab));
}));

// ── actions (V3.34.0): toasts, tab switch, purchases ─────────────────────
let ME = null;
let toastTimer = null;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
function showTab(name) {
  navBtns.forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('section.tab').forEach(s =>
    s.classList.toggle('active', s.id === 'tab-' + name));
}
async function buy(productId, btn) {
  if (btn) btn.disabled = true;
  const done = () => { if (btn) btn.disabled = false; };
  try {
    const r = await fetch('/webapp/api/invoice?init_data=' + encodeURIComponent(tg.initData || ''), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product: productId }),
    });
    if (r.status === 401) { toast(L.auth_short); done(); return; }
    const j = await r.json();
    if (!j.ok) { toast(L.invoice_err); done(); return; }
    if (typeof tg.openInvoice !== 'function') { toast(L.auth_short); done(); return; }
    tg.openInvoice(j.link, (status) => {
      done();
      if (status === 'paid') {
        toast(productId === 'premium' ? L.paid_prem : L.paid_credit);
        loadMe(); loadShop(); loadCharacters();
      } else if (status === 'failed') {
        toast(L.pay_failed);
      } else {
        toast(L.pay_cancelled);
      }
    });
  } catch (e) {
    toast(L.invoice_err); done();
  }
}

// ── characters ────────────────────────────────────────────────────────────
function renderCharacters(list) {
  const grid = document.getElementById('chargrid');
  // V3.35.0: the grid is the chat entry now — tap opens the dialog; the
  // «create your own» card rides at the end of the grid.
  const hasMine = list.some(c => c.mine);
  const cards = list.map(c => {
    const badge = c.status === 'active'
      ? `<span class="badge active">✅ ${esc(L.active)}</span>`
      : c.status === 'premium'
        ? `<span class="badge premium">⭐ ${esc(L.prem)}</span>`
        : `<span class="badge soon">🔒 ${esc(L.soon)}</span>`;
    const customBadge = c.custom
      ? `<span class="badge made" style="left:auto;right:8px;top:auto;bottom:8px">${c.mine ? '💚 ' + esc(L.mine_badge) : '🎨 ' + esc(L.made_badge)}</span>`
      : '';
    return `<div class="card${c.selected ? ' selected' : ''}" data-id="${esc(c.id)}" data-status="${esc(c.status)}" data-name="${esc(c.name)}" data-photo="${esc(c.photo)}" data-emoji="${esc(c.emoji)}" data-custom="${c.custom ? '1' : '0'}">
      <div class="photo">
        <img src="${esc(c.photo)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <div class="fallback">${esc(c.emoji)}</div>
        ${badge}${c.selected ? `<span class="badge" style="left:auto;right:8px;color:#e8447f">❤️</span>` : ''}${customBadge}
      </div>
      <div class="body">
        <div class="name">${esc(c.name)}</div>
        <div class="age">${esc(c.age)} ${esc(L.years)}</div>
        <div class="bio">${esc(c.bio)}</div>
      </div>
    </div>`;
  }).join('');
  const createCard = hasMine
    ? `<div class="card create" style="opacity:.75">
        <div class="photo" style="display:flex;align-items:center;justify-content:center"><div class="plus">🎨</div></div>
        <div class="body"><div class="lbl2">${esc(L.mychar_note)}</div></div>
      </div>`
    : `<div class="card create" id="createCard">
        <div class="photo" style="display:flex;align-items:center;justify-content:center"><div class="plus">➕</div></div>
        <div class="body"><div class="lbl2">${esc(L.create_own)}</div><div class="sub2">${esc(L.create_sub)}</div></div>
      </div>`;
  grid.innerHTML = cards + createCard;
  grid.querySelectorAll('.card[data-id]').forEach(el =>
    el.addEventListener('click', () => openCharacter(el)));
  const cc = document.getElementById('createCard');
  if (cc) cc.addEventListener('click', openWizard);
}

async function loadCharacters() {
  try {
    // With initData the grid also knows which girl is selected (V3.34.0 —
    // it re-renders after purchases and selections).
    const q = tg.initData ? ('?init_data=' + encodeURIComponent(tg.initData)) : '';
    const r = await fetch('/webapp/api/characters' + q);
    const j = await r.json();
    if (!j.ok || !j.characters.length) {
      document.getElementById('chargrid').innerHTML = '<div class="loading">—</div>'; return;
    }
    renderCharacters(j.characters);
  } catch (e) {
    document.getElementById('chargrid').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

let selecting = false;
async function doSelect(c) {
  if (selecting) return;
  if (c.status === 'premium' && !(ME && ME.premium)) { toast(L.need_premium); showTab('shop'); return; }
  if (c.status !== 'active' && c.status !== 'premium') { toast(L.locked); return; }
  selecting = true;
  try {
    const r = await fetch('/webapp/api/select?init_data=' + encodeURIComponent(tg.initData || ''), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ character_id: c.id }),
    });
    if (r.status === 401) { toast(L.auth_short); return; }
    if (r.status === 403) { toast(L.need_premium); showTab('shop'); return; }
    if (r.status === 400) { toast(L.locked); return; }
    const j = await r.json();
    if (j.ok) {
      renderCharacters(j.characters);
      toast(`${c.name} — ${L.selected_toast} ❤️`);
      loadMe();
      if (CHAT && CHAT.id === c.id) {
        CHAT.selected = true;
        document.getElementById('chatSelect').style.display = 'none';
      }
    }
  } catch (e) {
    toast(L.invoice_err);
  } finally {
    selecting = false;
  }
}

// ── V3.35.0: in-app chat — tap a card, the dialog opens ───────────────────
let CHAT = null;
let chatBusy = false;

function openCharacter(el) {
  const status = el.dataset.status;
  if (status === 'premium' && !(ME && ME.premium)) { toast(L.need_premium); showTab('shop'); return; }
  if (status !== 'active' && status !== 'premium') { toast(L.locked); return; }
  openChat({
    id: el.dataset.id,
    name: el.dataset.name,
    photo: el.dataset.photo,
    emoji: el.dataset.emoji,
    status: status,
    custom: el.dataset.custom === '1',
    selected: el.classList.contains('selected'),
  });
}

function fmtTime(ts) {
  if (!ts) return '';
  try {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (e) { return ''; }
}

function chatBubble(role, content, ts) {
  const t = fmtTime(ts) ? `<span class="t">${esc(fmtTime(ts))}</span>` : '';
  return `<div class="msg ${role === 'user' ? 'user' : 'bot'}">${esc(content)}${t}</div>`;
}

function openChat(c) {
  CHAT = c;
  document.getElementById('chatName').textContent = c.name;
  document.getElementById('chatSub').textContent = c.custom ? L.made_badge : (c.status === 'premium' ? L.prem : L.active);
  const ph = document.getElementById('chatPhoto');
  const em = document.getElementById('chatEmoji');
  ph.style.display = 'none'; em.style.display = 'flex'; em.textContent = c.emoji;
  ph.onload = () => { ph.style.display = 'block'; em.style.display = 'none'; };
  ph.onerror = () => { ph.style.display = 'none'; em.style.display = 'flex'; };
  ph.src = c.photo;
  const sel = document.getElementById('chatSelect');
  sel.textContent = '❤️ ' + L.set_main;
  sel.style.display = c.selected ? 'none' : '';
  document.getElementById('chatText').placeholder = L.input_ph;
  document.getElementById('chatMsgs').innerHTML = `<div class="loading">${esc(L.loading)}</div>`;
  document.getElementById('chatview').classList.add('open');
  loadChatHistory(c.id);
}

async function loadChatHistory(characterId) {
  try {
    const r = await fetch('/webapp/api/chat?init_data=' + encodeURIComponent(tg.initData || '') + '&character_id=' + encodeURIComponent(characterId));
    if (r.status === 401) { toast(L.auth_short); return; }
    const j = await r.json();
    const box = document.getElementById('chatMsgs');
    if (!j.ok) { box.innerHTML = `<div class="chat-empty">${esc(L.reply_err)}</div>`; return; }
    if (!j.history.length) { box.innerHTML = `<div class="chat-empty">${esc(L.empty_chat)}</div>`; return; }
    box.innerHTML = j.history.map(m => chatBubble(m.role, m.content, m.ts)).join('');
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    document.getElementById('chatMsgs').innerHTML = `<div class="chat-empty">${esc(L.empty_chat)}</div>`;
  }
}

async function sendChat() {
  if (!CHAT || chatBusy) return;
  const input = document.getElementById('chatText');
  const text = input.value.trim();
  if (!text) return;
  if (!tg.initData) { toast(L.auth_short); return; }
  chatBusy = true;
  input.value = '';
  const box = document.getElementById('chatMsgs');
  const empty = box.querySelector('.chat-empty');
  if (empty) empty.remove();
  box.insertAdjacentHTML('beforeend', chatBubble('user', text, null));
  box.insertAdjacentHTML('beforeend', `<div class="typing" id="chatTyping">${esc(CHAT.name)} …</div>`);
  box.scrollTop = box.scrollHeight;
  try {
    const r = await fetch('/webapp/api/chat?init_data=' + encodeURIComponent(tg.initData), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ character_id: CHAT.id, text: text }),
    });
    if (r.status === 401) { toast(L.auth_short); return; }
    if (r.status === 429) { toast(L.limit_reached); showTab('shop'); return; }
    if (r.status === 403) {
      const j = await r.json().catch(() => ({}));
      toast(j.error === 'consent' ? L.consent_needed : (j.error === 'premium_required' ? L.need_premium : L.locked));
      if (j.error === 'premium_required') showTab('shop');
      return;
    }
    const j = await r.json();
    if (!j.ok) { toast(L.reply_err); return; }
    box.insertAdjacentHTML('beforeend', chatBubble('bot', j.reply, null));
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    toast(L.reply_err);
  } finally {
    const typing = document.getElementById('chatTyping');
    if (typing) typing.remove();
    chatBusy = false;
    input.focus();
  }
}

// ── V3.35.0: character constructor wizard ─────────────────────────────────
let WIZ = { steps: [], idx: 0, params: {}, name: '', stars: 0, rub: 0, usd: 0, free: false };

async function openWizard() {
  try {
    const q = tg.initData ? ('?init_data=' + encodeURIComponent(tg.initData) + '&') : '?';
    const r = await fetch('/webapp/api/constructor/options' + q + 'lang=' + LANG);
    const j = await r.json();
    if (!j.ok || !j.steps || !j.steps.length) { toast(L.invoice_err); return; }
    WIZ = { steps: j.steps, idx: 0, params: {}, name: '', stars: j.stars || 0, rub: j.rub || 0, usd: j.usd || 0, free: !!j.free };
    document.getElementById('wizview').classList.add('open');
    renderWizStep();
  } catch (e) {
    toast(L.invoice_err);
  }
}

function renderWizStep() {
  const total = WIZ.steps.length;
  document.getElementById('wizTitle').textContent = L.create_own;
  document.getElementById('wizSub').textContent = L.wiz_step + ' ' + (WIZ.idx + 1) + '/' + (total + 1);
  const body = document.getElementById('wizBody');
  if (WIZ.idx < total) {
    const step = WIZ.steps[WIZ.idx];
    const opts = step.options.map(o =>
      `<button class="opt${WIZ.params[step.key] === o.value ? ' sel' : ''}" data-v="${esc(o.value)}">${esc(o.label)}</button>`).join('');
    body.innerHTML = `
      <div class="step-title">${esc(step.title)}</div>
      <div class="opts">${opts}</div>
      ${WIZ.idx > 0 ? `<button class="cta ghost" id="wizPrev">↩ ${esc(L.wiz_step)}</button>` : ''}`;
    body.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      WIZ.params[WIZ.steps[WIZ.idx].key] = b.dataset.v;
      WIZ.idx += 1;
      renderWizStep();
    }));
    const prev = document.getElementById('wizPrev');
    if (prev) prev.addEventListener('click', () => { WIZ.idx -= 1; renderWizStep(); });
    return;
  }
  // Final step: the name + a review of every choice + the price.
  const review = WIZ.steps.map(s => {
    const chosen = s.options.find(o => o.value === WIZ.params[s.key]);
    return chosen ? `<div>${esc(s.title.replace('?', ''))}: ${esc(chosen.label)}</div>` : '';
  }).filter(Boolean).join('');
  body.innerHTML = `
    <div class="step-title">${esc(L.wiz_name_ph)}</div>
    <input class="name" id="wizName" maxlength="24" value="${esc(WIZ.name)}">
    <div class="review">${review}</div>
    <div class="price-note" id="wizPrice">${WIZ.free ? '✅ ' + esc(L.wiz_free) : '⭐ ' + WIZ.stars + (WIZ.rub ? ' · ' + esc(WIZ.rub) + ' ₽' : '') + (WIZ.usd ? ' · $' + esc(WIZ.usd) : '')}</div>
    <button class="cta" id="wizCreate" ${WIZ.name ? '' : 'disabled'}>🎨 ${esc(L.wiz_create)}</button>`;
  const nameInput = document.getElementById('wizName');
  const createBtn = document.getElementById('wizCreate');
  nameInput.addEventListener('input', () => {
    WIZ.name = nameInput.value.trim();
    createBtn.disabled = !WIZ.name;
  });
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && WIZ.name) submitWizard();
  });
  createBtn.addEventListener('click', submitWizard);
}

async function submitWizard() {
  if (!WIZ.name) return;
  const btn = document.getElementById('wizCreate');
  if (btn) btn.disabled = true;
  try {
    // 1. Save the draft — it lands in the same constructor session the bot
    //    wizard uses, so the payment pipeline is identical.
    const dr = await fetch('/webapp/api/constructor/draft?init_data=' + encodeURIComponent(tg.initData || ''), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ params: WIZ.params, name: WIZ.name }),
    });
    if (dr.status === 401) { toast(L.auth_short); if (btn) btn.disabled = false; return; }
    if (dr.status === 409) { toast(L.wiz_exists); if (btn) btn.disabled = false; return; }
    const dj = await dr.json();
    if (!dj.ok) { toast(L.invoice_err); if (btn) btn.disabled = false; return; }
    // 2. Pay — admins and rub-credit holders get the free path.
    const br = await fetch('/webapp/api/constructor/buy?init_data=' + encodeURIComponent(tg.initData || ''), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({}),
    });
    if (br.status === 401) { toast(L.auth_short); if (btn) btn.disabled = false; return; }
    const bj = await br.json();
    if (!bj.ok) { toast(L.invoice_err); if (btn) btn.disabled = false; return; }
    if (bj.free) {
      closeWizard();
      toast(L.wiz_paid_toast);
      pollCharacters();
      return;
    }
    if (typeof tg.openInvoice !== 'function') { toast(L.auth_short); if (btn) btn.disabled = false; return; }
    tg.openInvoice(bj.link, (status) => {
      if (btn) btn.disabled = false;
      if (status === 'paid') {
        closeWizard();
        toast(L.wiz_paid_toast);
        pollCharacters();
      } else if (status === 'failed') {
        toast(L.pay_failed);
      } else {
        toast(L.pay_cancelled);
      }
    });
  } catch (e) {
    toast(L.invoice_err);
    if (btn) btn.disabled = false;
  }
}

function closeWizard() {
  document.getElementById('wizview').classList.remove('open');
}

let pollTimer = null;
function pollCharacters() {
  // The avatar job takes up to a minute — refresh the grid until she appears.
  let tries = 0;
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    tries += 1;
    await loadCharacters();
    if (tries >= 18) clearInterval(pollTimer);
  }, 5000);
}

// ── shop ──────────────────────────────────────────────────────────────────
async function loadShop() {
  try {
    const r = await fetch('/webapp/api/shop?lang=' + LANG);
    const j = await r.json();
    if (!j.ok) return;
    const s = j.shop, p = s.premium;
    // V3.36.0: every Stars price shows its rub + dollar equivalent.
    const fiat = o => (o.rub ? ` · ${esc(o.rub)} ₽` : '') + (o.usd ? ` · $${esc(o.usd)}` : '');
    const price = `⭐ ${p.stars} <small>${esc(L.month)}</small>` + fiat(p);
    const feats = p.features.map(f => `<li><span>${esc(f.emoji)}</span><span>${esc(LANG === 'en' ? f.en : f.ru)}</span></li>`).join('');
    // V3.34.0: what the app sells directly — the CTA button on the Premium
    // hero and the +1 photo credit row; the rest of the list stays a price
    // reference for chat purchases.
    const purchases = s.purchases || [];
    const premBuy = purchases.find(x => x.id === 'premium');
    const premWeek = purchases.find(x => x.id === 'premium_week');
    const credit = purchases.find(x => x.id === 'photo_credit');
    // V3.36.0: the rub + dollar prices ride next to the Stars price on both plans.
    const moRub = premBuy ? fiat(premBuy) : '';
    const wkRub = premWeek ? fiat(premWeek) : '';
    const heroBtn = premBuy ? `<button class="cta" data-buy="premium">⭐ ${premBuy.stars} — ${esc(L.buy)}${moRub}</button>` : '';
    const heroWeekBtn = premWeek ? `<button class="cta ghost" data-buy="premium_week">⭐ ${premWeek.stars} — ${esc(L.week)}${wkRub}</button>` : '';
    const creditRow = credit
      ? `<div class="row-item"><span class="n">${esc(credit.emoji)} ${esc(credit.title)}</span><span class="buy-cell"><span class="c">${credit.stars} ⭐${fiat(credit)}</span><button class="cta small" data-buy="photo_credit">${esc(L.buy)}</button></span></div>`
      : '';
    const items = s.items.map(i => `<div class="row-item"><span class="n">${esc(i.emoji)} ${esc(i.name)}</span><span class="c">${i.stars} ⭐${fiat(i)}</span></div>`).join('');
    document.getElementById('shopbody').innerHTML = `
      <div class="hero">
        <div class="title">⭐ Premium</div>
        <div class="price">${price}</div>
        <ul>${feats}</ul>
        ${heroBtn}
        ${heroWeekBtn}
      </div>
      ${creditRow}
      ${items}
      <div class="note">${esc(L.pay_hint)}</div>
      <div class="note">💬 ${s.free_tier.messages_per_day} ${esc(L.msg_day)} · 📸 ${s.free_tier.photos_level_1_2}–${s.free_tier.photos_level_3_6} ${esc(L.photos_day)}</div>`;
    document.querySelectorAll('#shopbody [data-buy]').forEach(b =>
      b.addEventListener('click', () => buy(b.dataset.buy, b)));
  } catch (e) {
    document.getElementById('shopbody').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

// ── profile ───────────────────────────────────────────────────────────────
async function loadMe() {
  const chip = document.getElementById('userchip');
  try {
    const r = await fetch('/webapp/api/me?init_data=' + encodeURIComponent(tg.initData || ''));
    if (r.status === 401) {
      document.getElementById('profilebody').innerHTML = `<div class="err">${L.err_auth}</div>`;
      chip.textContent = '—'; return;
    }
    const j = await r.json();
    if (!j.ok) return;
    const m = j.me;
    ME = m;
    chip.textContent = m.premium ? '⭐ Premium' : (m.name || ('#' + m.id));
    chip.className = 'chip' + (m.premium ? ' premium' : '');
    const initial = (m.name || user0.first_name || 'A').trim().charAt(0).toUpperCase();
    const lvlPct = Math.min(100, Math.round(m.selected_character.level / 8 * 100));
    document.getElementById('profilebody').innerHTML = `
      <div class="profile-head">
        <div class="avatar">${esc(initial)}</div>
        <div>
          <div class="nm">${esc(m.name || user0.first_name || '—')}</div>
          <div class="sub">${m.premium ? '⭐ ' + esc(L.premium_on) : esc(L.premium_off)} · id ${esc(m.id)}</div>
        </div>
      </div>
      <div class="stat"><span class="k">👩 ${esc(L.selected_girl)}</span><span class="v">${esc(m.selected_character.name)}</span></div>
      <div class="stat" style="flex-direction:column;align-items:stretch">
        <div style="display:flex;justify-content:space-between">
          <span class="k">❤️ ${esc(L.level)}</span><span class="v">${esc(m.selected_character.level)} / 8</span>
        </div>
        <div class="bar"><i style="width:${lvlPct}%"></i></div>
      </div>
      <div class="stat"><span class="k">🔥 ${esc(L.streak)}</span><span class="v">${esc(m.streak)}</span></div>
      <div class="note">${esc(L.open_bot)}</div>`;
  } catch (e) {
    document.getElementById('profilebody').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

// ── documents ─────────────────────────────────────────────────────────────
async function loadDocs() {
  try {
    const r = await fetch('/webapp/api/legal?lang=' + LANG);
    const j = await r.json();
    if (!j.ok) return;
    const d = j.legal;
    document.getElementById('checkword').textContent = `${L.checkword}: ${d.check_word}`;
    document.getElementById('docsbody').innerHTML = `
      <details class="doc"><summary>🔐 ${esc(L.privacy)}</summary><div class="txt">${esc(d.privacy)}</div></details>
      <details class="doc"><summary>📄 ${esc(L.agreement)}</summary><div class="txt">${esc(d.agreement)}</div></details>
      <details class="doc"><summary>💰 ${esc(L.tariffs)}</summary><div class="txt">${esc(d.tariffs)}</div></details>
      <details class="doc"><summary>🛟 ${esc(L.support)}</summary><div class="txt">${esc(d.support)}</div></details>`;
  } catch (e) {
    document.getElementById('docsbody').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

// ── V3.35.0 wiring: chat + wizard overlays ─────────────────────────────
document.getElementById('chatBack').addEventListener('click', () => {
  document.getElementById('chatview').classList.remove('open');
  CHAT = null;
});
document.getElementById('chatSend').addEventListener('click', sendChat);
document.getElementById('chatText').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChat();
});
document.getElementById('chatSelect').addEventListener('click', () => { if (CHAT) doSelect(CHAT); });
document.getElementById('wizBack').addEventListener('click', () => {
  if (WIZ.idx > 0) { WIZ.idx -= 1; renderWizStep(); return; }
  closeWizard();
});

loadMe();
loadCharacters();
loadShop();
loadDocs();
